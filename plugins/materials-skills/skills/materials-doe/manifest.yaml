version: "1.1.0"
status: stable

context_budget:
  target_activation_bytes: 16384
  max_activation_bytes: 18432
  max_always_load: 3
  max_skill_lines: 55
  max_workflow_lines: 70
  route_scenarios_file: evals/context-routes.yaml
  required_route_axes:
    - design_mode
    - material_family
    - domain
    - output
    - output_format
  required_route_scenarios:
    - default-classical-note
    - taguchi-asphalt-matrix
    - rsm-polymer-record
    - constrained-mixture-matrix
    - doe-to-data-handoff
    - doe-to-writing-methods

always_load:
  - static/core/contract.md
  - ../_shared/core/direction-profile.md
  - static/core/workflow.md

axes:
  design_mode:
    detect: "Which design-of-experiments approach does the user need?"
    default: classical
    values:
      classical:
        path: static/core/classical-doe.md
        triggers: ["classical", "full factorial", "Taguchi", "经典"]
      orthogonal:
        path: static/core/orthogonal-tables.md
        triggers: ["orthogonal", "orthogonal array", "L9", "极差分析"]
      screening:
        path: static/core/screening-designs.md
        triggers: ["Plackett-Burman", "PB", "factor screening", "因子筛选"]
      response-surface:
        path: static/core/response-surface.md
        triggers: ["RSM", "response surface", "CCD", "响应面"]
      mixture-design:
        path: static/core/mixture-design.md
        triggers: ["simplex lattice", "simplex centroid", "混料设计"]
      mix-design:
        path: static/core/mix-design-guide.md
        triggers: ["mix design", "mixture proportion", "D-optimal", "配合比"]

  material_family:
    detect: "Which materials family is central?"
    default: neutral
    values:
      neutral:
        path: ../_shared/core/direction-profile.md
        triggers: ["neutral family", "profile family fallback", "no saved family"]
      civil:
        path: ../materials-research/static/fragments/domain/civil-family.md
        triggers: ["civil", "construction", "土木"]
      polymers:
        path: ../materials-research/static/fragments/domain/polymers-family.md
        triggers: ["polymer", "resin", "高分子"]
      metals:
        path: ../materials-research/static/fragments/domain/metals-family.md
        triggers: ["metal", "alloy", "金属"]
      ceramics:
        path: ../materials-research/static/fragments/domain/ceramics-family.md
        triggers: ["ceramic", "porcelain", "陶瓷"]
      functional:
        path: ../materials-research/static/fragments/domain/functional-family.md
        triggers: ["semiconductor", "dielectric", "半导体"]
      nano:
        path: ../materials-research/static/fragments/domain/nano-family.md
        triggers: ["nano", "nanoparticle", "纳米"]

  domain:
    detect: "Which materials field is the experiment design for?"
    default: general
    values:
      general:
        path: ../_shared/core/direction-profile.md
        triggers: ["general fallback", "profile fallback", "neutral routing"]
      asphalt:
        path: static/reference/asphalt-experiments.md
        triggers: ["asphalt", "emulsified asphalt", "沥青"]
      cement-concrete:
        path: static/reference/cement-experiments.md
        triggers: ["cement", "concrete", "水泥"]
      insulation:
        path: static/reference/insulation-experiments.md
        triggers: ["insulation", "thermal insulation", "保温"]
      polymers:
        path: static/reference/polymers-experiments.md
        triggers: ["polymer", "thermoplastic", "高分子"]
      metals:
        path: static/reference/metals-experiments.md
        triggers: ["metal", "alloy", "金属"]
      ceramics:
        path: static/reference/ceramics-experiments.md
        triggers: ["ceramic", "陶瓷"]
      functional:
        path: static/reference/functional-experiments.md
        triggers: ["semiconductor", "dielectric", "半导体"]
      nano:
        path: static/reference/nano-experiments.md
        triggers: ["nano", "nanoparticle", "纳米"]

  output:
    detect: "What deliverable does the user expect?"
    default: note
    values:
      note:
        path: static/core/workflow.md
        triggers: ["note", "summary", "说明"]
      matrix:
        path: static/reference/factor-level-template.md
        triggers: ["matrix", "test matrix", "因子矩阵"]
      figure-package:
        path: static/reference/doe-figure-package.md
        triggers: ["figure", "plot", "图"]
      analysis-plan:
        path: static/core/response-surface.md
        triggers: ["analysis plan", "ANOVA", "分析计划"]

  output_format:
    detect: "In what format should the design be delivered?"
    default: yaml-record
    values:
      yaml-record:
        path: static/core/experiment-record-output.md
        triggers: ["yaml", "record"]
      textual:
        path: static/core/output-format.md
        triggers: ["text", "summary"]

references:
  on_demand:
    evidence-contract:
      path: ../_shared/core/evidence-contract.md
      when: "The task audits claim support, statistical conclusions, or an evidence chain."
    screening-factor-template:
      path: static/reference/factor-level-template.md
      when: "A screening design needs a reusable factor-level worksheet."
    classical-validity:
      path: static/core/classical-doe.md
      when: "The user asks about sample size, replication, randomization, controls, power, or design validity."

assets:
  - assets/templates
scripts:
  - scripts
quality_gates:
  - release gate must report no issues for this skill
  - claims must stay inside the skill evidence contract
handoffs:
  provides:
    doe-handoff:
      description: "Design-of-experiments plan with factor matrix, levels, and analysis strategy"
      contract: ../../_shared/contracts/doe-handoff.yaml
      version: "1.0"
  consumes:
    - handoff: citation-handoff
      from: materials-citation
      optional: true
    - handoff: reader-package
      from: materials-reader
      optional: true
release_checks:
  - scripts/run_release_checks.py --json
  - scripts/check_skill_architecture.py --json
