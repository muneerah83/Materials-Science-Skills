version: "1.3.0"
status: stable

# Universal core only. Risk and document-scale guidance is loaded on demand.
context_budget:
  target_activation_bytes: 25600
  max_activation_bytes: 28672
  max_always_load: 5
  max_skill_lines: 70
  max_workflow_lines: 120

always_load:
  - static/core/contract.md
  - static/core/stance.md
  - static/core/workflow.md
  - static/core/output-format.md
  - ../_shared/core/direction-profile.md

axes:
  section:
    detect: |
      Identify which section(s) the user wants polished. The user may name one or several.
      If unclear, ask before loading. Skip this axis only when the user provides standalone
      prose with no section context.
    default: generic
    values:
      abstract:
        path: references/abstract.md
        triggers: ["abstract", "摘要"]
      introduction:
        path: references/introduction.md
        triggers: ["introduction", "intro", "引言"]
      methods:
        path: static/fragments/section/methods.md
        triggers: ["methods", "methodology", "实验方法"]
      results-discussion:
        path: references/results-discussion.md
        triggers: ["results", "discussion", "结果"]
      conclusions:
        path: references/conclusions.md
        triggers: ["conclusion", "conclusions", "结论"]
      title:
        path: static/fragments/section/title.md
        triggers: ["title", "标题"]
      cover-letter:
        path: references/cover-letter.md
        triggers: ["cover letter", "submission letter", "投稿信"]
      generic:
        path: references/style-guardrails.md
        triggers: ["polish", "rewrite", "translate", "润色"]

  paper_type:
    detect: |
      Decide what kind of paper or section is being polished. Default to research.
      Use the user's stated framing first; fall back to inference from the text.
    default: research
    values:
      research:
        path: static/fragments/paper_type/research.md
        triggers: ["research", "experimental", "实验"]
      review:
        path: static/fragments/paper_type/review.md
        triggers: ["review", "mini-review", "综述"]

  journal_family:
    detect: |
      Identify the target journal family from the user's prompt or manuscript.
      Default to materials for generic or unspecified requests.
    default: materials
    values:
      materials:
        path: references/style-guardrails.md
        triggers: ["CBM", "JBE", "土木材料"]
      pavement:
        path: references/pavement-language.md
        triggers: ["RMPD", "IJPE", "pavement", "路面"]
      cement-concrete:
        path: references/cement-concrete-language.md
        triggers: ["CCC", "CCR", "水泥"]
      polymers:
        path: references/polymers-language.md
        triggers: ["polymer", "thermoplastic", "高分子"]
      ceramics:
        path: references/ceramics-language.md
        triggers: ["ceramic", "sintering", "陶瓷"]
      metals:
        path: references/metals-language.md
        triggers: ["metal", "alloy", "金属"]
      insulation:
        path: references/insulation-language.md
        triggers: ["thermal insulation", "aerogel", "隔热"]
      nano:
        path: references/nano-language.md
        triggers: ["nano", "nanoparticle", "纳米"]
      functional:
        path: references/functional-language.md
        triggers: ["semiconductor", "dielectric", "半导体"]

  language_mode:
    default: rulebook
    values:
      rulebook:
        path: references/language-rulebook.md
        triggers: ["language rules", "SCI style", "语言规则"]
      chinese-to-english:
        path: references/chinese-to-english-patterns.md
        triggers: ["Chinese to English", "translate", "中译英"]
      claim-strength:
        path: ../_shared/core/claim-strength-ladder.md
        triggers: ["claim strength", "hedging", "overclaim", "语气"]
  material_family:
    detect: "Which materials family is central?"
    default: neutral
    values:
      neutral:
        path: ../_shared/core/direction-profile.md
        triggers: ["neutral family", "profile family fallback", "no saved family"]
      civil:
        path: ../materials-research/static/fragments/domain/civil-family.md
        triggers: ["civil", "construction", "土木"]
      polymers:
        path: ../materials-research/static/fragments/domain/polymers-family.md
        triggers: ["polymer", "resin", "高分子"]
      metals:
        path: ../materials-research/static/fragments/domain/metals-family.md
        triggers: ["metal", "alloy", "金属"]
      ceramics:
        path: ../materials-research/static/fragments/domain/ceramics-family.md
        triggers: ["ceramic", "porcelain", "陶瓷"]
      functional:
        path: ../materials-research/static/fragments/domain/functional-family.md
        triggers: ["semiconductor", "dielectric", "半导体"]
      nano:
        path: ../materials-research/static/fragments/domain/nano-family.md
        triggers: ["nano", "nanoparticle", "纳米"]

  domain:
    detect: "Which material domain does the manuscript target?"
    default: general
    values:
      general:
        path: ../_shared/core/direction-profile.md
        triggers: ["general fallback", "profile fallback", "neutral routing"]
      civil:
        path: static/fragments/domain/civil.md
        triggers: ["civil", "asphalt", "concrete", "土木"]
      polymers:
        path: static/fragments/domain/polymers.md
        triggers: ["polymer", "resin", "epoxy", "高分子"]
      metals:
        path: static/fragments/domain/metals.md
        triggers: ["metal", "alloy", "steel", "合金"]
      ceramics:
        path: static/fragments/domain/ceramics.md
        triggers: ["ceramic", "porcelain", "sintering", "陶瓷"]
      functional:
        path: static/fragments/domain/functional.md
        triggers: ["semiconductor", "dielectric", "piezoelectric", "半导体"]
      nano:
        path: static/fragments/domain/nano.md
        triggers: ["nano", "nanoparticle", "2D material", "纳米"]

references:
  on_demand:
    failure-modes:
      path: static/core/failure-modes.md
      when: "The task needs structural repair, paragraph-flow diagnosis, multiple paragraphs, or section-function analysis."
    evidence-contract:
      path: ../_shared/core/evidence-contract.md
      when: "The text contains mechanism, sustainability, applicability, durability, or other claim-evidence questions."
    claim-strength:
      path: ../_shared/core/claim-strength-ladder.md
      when: "The text contains causal, statistical-significance, novelty, absolute, negative-result, or inconclusive-evidence wording."
    terminology-ledger:
      path: ../_shared/core/terminology-ledger.md
      when: "The task spans multiple paragraphs or needs terminology, abbreviation, unit, notation, or bilingual consistency."
    ethics:
      path: ../_shared/core/ethics.md
      when: "The task includes citation integrity, source attribution, sensitive material, or explicit AI-use boundaries."
    weakness-routing:
      path: ../_shared/paper-production/weakness-routing.md
      when: "The polish is part of a paper-production handoff, reviewer weakness, or regression-gate workflow."
    journal-cbm-facts:
      path: ../_shared/journal-formats/cbm.md
      when: "The target journal is CBM, Construction and Building Materials."
    journal-ccc-facts:
      path: ../_shared/journal-formats/ccc.md
      when: "The target journal is CCC, Cement and Concrete Composites."
    journal-rmpd-facts:
      path: ../_shared/journal-formats/rmpd.md
      when: "The target journal is RMPD or IJPE."
    journal-jbe-facts:
      path: ../_shared/journal-formats/jbe.md
      when: "The target journal is JBE, Journal of Building Engineering."
    en-rules:
      path: static/fragments/language/en.md
      when: "The user needs English polishing rules."
    zh-to-en-rules:
      path: static/fragments/language/zh-to-en.md
      when: "The user needs Chinese-to-English rules."
    claim-strength-local:
      path: references/claim-strength-ladder.md
      when: "The user needs a local copy of the claim strength ladder."
    hourglass-structure:
      path: references/hourglass-structure.md
      when: "The user needs to verify section structure, information flow, or paragraph order."
    vocabulary-upgrade:
      path: references/vocabulary-upgrade.md
      when: "The user needs to upgrade weak words, calibrate verbs to evidence level, or replace vague adjectives."
    citation-integrity:
      path: references/citation-integrity.md
      when: "The user needs to audit citations, verify attribution, or check citation density."
    british-english:
      path: references/british-english.md
      when: "The user needs British English spelling, journal-specific English requirements, or consistency checks."
    proofreading:
      path: references/proofreading.md
      when: "The user needs final mechanical checks, proofreading, or pre-submission polish."
    section-abstract:
      path: static/fragments/section/abstract.md
      when: "The user is polishing an abstract and needs section-specific guidance."
    section-introduction:
      path: static/fragments/section/introduction.md
      when: "The user is polishing an introduction and needs section-specific guidance."
    section-results:
      path: static/fragments/section/results.md
      when: "The user is polishing a results section and needs section-specific guidance."
    section-discussion:
      path: static/fragments/section/discussion.md
      when: "The user is polishing a discussion section and needs section-specific guidance."
    section-conclusion:
      path: static/fragments/section/conclusion.md
      when: "The user is polishing a conclusion and needs section-specific guidance."
assets:
  - assets
scripts:
  - scripts
quality_gates:
  - release gate must report no issues for this skill
  - claims must stay inside the skill evidence contract
handoffs:
  provides: {}
  consumes: []
release_checks:
  - scripts/run_release_checks.py --json
  - scripts/check_skill_architecture.py --json
